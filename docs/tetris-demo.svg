<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f1e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="500" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="200" y="35" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle" font-family="monospace">I.QUEUE TETRIS</text>
  
  <!-- Game Container Border -->
  <rect x="50" y="60" width="300" height="380" fill="#1a1a3e" stroke="#3498db" stroke-width="2" rx="4"/>
  
  <!-- Grid background -->
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#333" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect x="50" y="60" width="300" height="380" fill="url(#grid)"/>
  
  <!-- Falling block (cyan I-piece) -->
  <rect x="155" y="80" width="30" height="30" fill="#1abc9c" stroke="#fff" stroke-width="1"/>
  <rect x="155" y="110" width="30" height="30" fill="#1abc9c" stroke="#fff" stroke-width="1"/>
  <rect x="155" y="140" width="30" height="30" fill="#1abc9c" stroke="#fff" stroke-width="1"/>
  
  <!-- Stacked blocks at bottom -->
  <!-- Orange memory rod blocks -->
  <rect x="80" y="370" width="30" height="30" fill="#e67e22" stroke="#fff" stroke-width="1"/>
  <rect x="80" y="340" width="30" height="30" fill="#e67e22" stroke="#fff" stroke-width="1"/>
  <rect x="80" y="310" width="30" height="30" fill="#e67e22" stroke="#fff" stroke-width="1"/>
  
  <!-- Blue skill blocks -->
  <rect x="110" y="370" width="30" height="30" fill="#3498db" stroke="#fff" stroke-width="1"/>
  <rect x="110" y="340" width="30" height="30" fill="#3498db" stroke="#fff" stroke-width="1"/>
  
  <!-- Purple alignment blocks -->
  <rect x="140" y="370" width="30" height="30" fill="#9b59b6" stroke="#fff" stroke-width="1"/>
  <rect x="140" y="340" width="30" height="30" fill="#9b59b6" stroke="#fff" stroke-width="1"/>
  
  <!-- Green rule blocks -->
  <rect x="260" y="370" width="30" height="30" fill="#2ecc71" stroke="#fff" stroke-width="1"/>
  <rect x="260" y="340" width="30" height="30" fill="#2ecc71" stroke="#fff" stroke-width="1"/>
  
  <!-- Red blocks -->
  <rect x="230" y="370" width="30" height="30" fill="#e74c3c" stroke="#fff" stroke-width="1"/>
  
  <!-- Bottom status bar -->
  <rect x="50" y="450" width="300" height="40" fill="#0a0a14" stroke="#3498db" stroke-width="1" rx="2"/>
  
  <!-- Status text -->
  <text x="60" y="470" font-size="12" fill="#2ecc71" font-family="monospace">Score: 1240</text>
  <text x="200" y="470" font-size="12" fill="#2ecc71" font-family="monospace" text-anchor="middle">Level: 3</text>
  <text x="320" y="470" font-size="12" fill="#2ecc71" font-family="monospace" text-anchor="end">Lines: 5</text>
  
  <!-- Legend below game -->
  <g transform="translate(50, 390)">
    <!-- Memory label -->
    <circle cx="0" cy="0" r="4" fill="#e67e22"/>
    <text x="15" y="5" font-size="11" fill="#ccc" font-family="monospace">Memory</text>
    
    <!-- Skill label -->
    <circle cx="90" cy="0" r="4" fill="#3498db"/>
    <text x="105" y="5" font-size="11" fill="#ccc" font-family="monospace">Skill</text>
    
    <!-- Alignment label -->
    <circle cx="160" cy="0" r="4" fill="#9b59b6"/>
    <text x="175" y="5" font-size="11" fill="#ccc" font-family="monospace">Align</text>
  </g>
</svg>