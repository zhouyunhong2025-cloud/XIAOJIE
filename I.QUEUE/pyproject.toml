[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "agentforge"
version = "0.1.0"
description = "Build AI agents with Python functions, not giant text prompts"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["ai", "agent", "llm", "framework", "alignment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = []   # zero required deps — LLM libs are optional

[project.optional-dependencies]
openai    = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
all       = ["openai>=1.0", "anthropic>=0.20"]

[project.urls]
Homepage   = "https://github.com/YOUR_USERNAME/agentforge"
Repository = "https://github.com/YOUR_USERNAME/agentforge"
Issues     = "https://github.com/YOUR_USERNAME/agentforge/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentforge*"]
